<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本周收藏回顾 — XHS 知识库</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root {
            --bg-page: #060503;
            --bg-card: #0d0b08;
            --bg-surface: #110f0c;
            --accent: #FE2C55;
            --accent-dim: rgba(254, 44, 85, 0.10);
            --accent-glow: rgba(254, 44, 85, 0.22);
            --text-1: #f0e6d2;
            --text-2: #8a7560;
            --text-3: #5a4d3e;
            --border: rgba(138, 117, 96, 0.12);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: radial-gradient(ellipse at 50% 30%, rgba(254,44,85,0.035) 0%, var(--bg-page) 60%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Noto Sans SC', system-ui, sans-serif;
            color: var(--text-1);
            padding: 40px 16px;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Card ── */
        .card {
            width: 400px;
            position: relative;
            background: linear-gradient(175deg, #12100c 0%, var(--bg-card) 40%, #0a0907 100%);
            border-radius: 20px;
            border: 1px solid var(--border);
            overflow: hidden;
            box-shadow: 0 12px 64px rgba(0,0,0,0.55), 0 0 120px rgba(254,44,85,0.04);
            opacity: 0;
            transform: translateY(12px) scale(0.98);
            animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent) 0%, rgba(254,44,85,0.25) 50%, transparent 100%);
        }

        .card::after {
            content: '';
            position: absolute;
            top: -80px; left: 50%;
            transform: translateX(-50%);
            width: 260px; height: 260px;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
            pointer-events: none;
            opacity: 0.5;
        }

        .card-inner {
            position: relative;
            z-index: 1;
            padding: 26px 18px 20px;
        }

        /* ── Header ── */
        .brand {
            font-size: 12px;
            color: var(--text-2);
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .brand-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 8px rgba(254,44,85,0.5);
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin-top: 14px;
            letter-spacing: -0.3px;
            color: var(--text-1);
        }

        .date-range {
            font-size: 13px;
            color: var(--text-2);
            margin-top: 5px;
            font-variant-numeric: tabular-nums;
        }

        /* ── Hero stat ── */
        .stat-section {
            margin-top: 28px;
            text-align: center;
            padding: 20px 0;
        }

        .stat-number {
            font-family: 'DM Sans', sans-serif;
            font-size: 72px;
            font-weight: 900;
            line-height: 1;
            color: var(--text-1);
            position: relative;
            display: inline-block;
        }

        .stat-number::after {
            content: '';
            position: absolute;
            bottom: 4px; left: 50%;
            transform: translateX(-50%);
            width: 80%; height: 16px;
            background: radial-gradient(ellipse, var(--accent-dim) 0%, transparent 80%);
            border-radius: 50%;
            filter: blur(6px);
        }

        .stat-label {
            display: block;
            font-size: 14px;
            color: var(--text-2);
            margin-top: 6px;
            letter-spacing: 2px;
        }

        /* ── Section label ── */
        .section-label {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-3);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-label::before {
            content: '';
            width: 3px; height: 3px;
            border-radius: 50%;
            background: var(--accent);
        }

        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* ── Categories ── */
        .categories {
            margin-top: 28px;
        }

        .cat-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .cat-name {
            font-size: 13px;
            color: var(--text-2);
            width: 60px;
            flex-shrink: 0;
            text-align: right;
        }

        .cat-bar-track {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: var(--accent-dim);
            overflow: hidden;
        }

        .cat-bar-fill {
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--accent), rgba(254,44,85,0.55));
            width: 0;
            transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cat-count {
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-2);
            width: 20px;
            flex-shrink: 0;
        }

        /* ── Top notes ── */
        .top-notes {
            margin-top: 28px;
        }

        .note-item {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            margin-bottom: 8px;
            padding: 9px 11px;
            background: var(--bg-surface);
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .note-rank {
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 700;
            width: 22px; height: 22px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #fff;
        }

        .note-rank.r1 { background: var(--accent); box-shadow: 0 2px 10px rgba(254,44,85,0.35); }
        .note-rank.r2 { background: #C9985A; }
        .note-rank.r3 { background: var(--text-3); }

        .note-body { flex: 1; min-width: 0; }

        .note-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-1);
            line-height: 1.35;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .note-summary {
            font-size: 11px;
            color: var(--text-3);
            margin-top: 2px;
            line-height: 1.45;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* ── AI quote ── */
        .ai-section {
            margin-top: 24px;
            padding: 16px 18px;
            border-left: 3px solid var(--accent);
            background: var(--accent-dim);
            border-radius: 0 12px 12px 0;
        }

        .ai-tag {
            font-size: 10px;
            font-weight: 500;
            color: var(--accent);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .ai-text {
            font-size: 14px;
            color: var(--text-1);
            line-height: 1.7;
            font-weight: 300;
        }

        /* ── Footer ── */
        .card-footer {
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .footer-brand {
            font-size: 11px;
            color: var(--text-3);
            letter-spacing: 0.5px;
        }

        .footer-date {
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            color: var(--text-3);
        }

        /* ── Export button ── */
        .export-area {
            margin-top: 28px;
            display: flex;
            gap: 12px;
        }

        .export-btn {
            padding: 10px 24px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-surface);
            color: var(--text-2);
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .export-btn:hover {
            background: rgba(254,44,85,0.08);
            border-color: rgba(254,44,85,0.25);
            color: var(--text-1);
        }

        .export-btn:active {
            transform: scale(0.97);
        }

        .export-btn:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* ── Animations ── */
        @keyframes cardIn {
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .anim-section {
            opacity: 0;
            transform: translateY(16px);
            animation: sectionIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .anim-section:nth-child(1) { animation-delay: 0.2s; }
        .anim-section:nth-child(2) { animation-delay: 0.35s; }
        .anim-section:nth-child(3) { animation-delay: 0.5s; }
        .anim-section:nth-child(4) { animation-delay: 0.65s; }
        .anim-section:nth-child(5) { animation-delay: 0.8s; }
        .anim-section:nth-child(6) { animation-delay: 0.95s; }
        .anim-section:nth-child(7) { animation-delay: 1.1s; }

        @keyframes sectionIn {
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            .card, .anim-section {
                animation: none;
                opacity: 1;
                transform: none;
            }
            .cat-bar-fill { transition: none; }
        }

        @media (max-width: 440px) {
            .card { width: 100%; border-radius: 16px; }
            .card-inner { padding: 24px 20px 20px; }
            .stat-number { font-size: 56px; }
        }
    </style>
</head>
<body>

<div class="card" id="card">
    <div class="card-inner">

        <!-- Header -->
        <div class="anim-section">
            <div class="brand">
                <span class="brand-dot"></span>
                XHS 知识库
            </div>
            <h1 class="title">本周收藏回顾</h1>
            <div class="date-range">2026.05.27 — 2026.06.04</div>
        </div>

        <!-- Hero stat -->
        <div class="anim-section stat-section">
            <span class="stat-number" id="statNumber">0</span>
            <span class="stat-label">篇笔记</span>
        </div>

        <!-- Categories -->
        <div class="anim-section categories">
            <div class="section-label">收藏分布</div>
            <div id="catBars">
                <div class="cat-row">
                    <span class="cat-name">装修灵感</span>
                    <div class="cat-bar-track"><div class="cat-bar-fill" data-width="100"></div></div>
                    <span class="cat-count">8</span>
                </div>
                <div class="cat-row">
                    <span class="cat-name">护肤测评</span>
                    <div class="cat-bar-track"><div class="cat-bar-fill" data-width="75"></div></div>
                    <span class="cat-count">6</span>
                </div>
                <div class="cat-row">
                    <span class="cat-name">美食食谱</span>
                    <div class="cat-bar-track"><div class="cat-bar-fill" data-width="62"></div></div>
                    <span class="cat-count">5</span>
                </div>
                <div class="cat-row">
                    <span class="cat-name">旅行攻略</span>
                    <div class="cat-bar-track"><div class="cat-bar-fill" data-width="50"></div></div>
                    <span class="cat-count">4</span>
                </div>
                <div class="cat-row">
                    <span class="cat-name">穿搭分享</span>
                    <div class="cat-bar-track"><div class="cat-bar-fill" data-width="37"></div></div>
                    <span class="cat-count">3</span>
                </div>
                <div class="cat-row">
                    <span class="cat-name">数码科技</span>
                    <div class="cat-bar-track"><div class="cat-bar-fill" data-width="25"></div></div>
                    <span class="cat-count">2</span>
                </div>
            </div>
        </div>

        <!-- Top notes -->
        <div class="anim-section top-notes">
            <div class="section-label">本周精选</div>
            <div class="note-item">
                <div class="note-rank r1">1</div>
                <div class="note-body">
                    <div class="note-title">2026最值得入手的防晒霜测评</div>
                    <div class="note-summary">从肤感、防晒力、成膜速度三个维度横评8款热门防晒</div>
                </div>
            </div>
            <div class="note-item">
                <div class="note-rank r2">2</div>
                <div class="note-body">
                    <div class="note-title">小户型54m²改造全记录</div>
                    <div class="note-summary">两个人住54平，从布局到收纳的全套方案，附预算清单</div>
                </div>
            </div>
            <div class="note-item">
                <div class="note-rank r3">3</div>
                <div class="note-body">
                    <div class="note-title">云南自驾7天路线规划</div>
                    <div class="note-summary">昆明出发环线，每天车程不超过4h，附住宿和避坑指南</div>
                </div>
            </div>
        </div>

        <!-- AI quote -->
        <div class="anim-section ai-section">
            <div class="ai-tag">AI 收藏画像</div>
            <div class="ai-text">你是一个热爱生活的美学收藏家，本周最关注居家与护肤话题，收藏风格偏向实用攻略型</div>
        </div>

        <!-- Footer -->
        <div class="anim-section card-footer">
            <span class="footer-brand">XHS 知识库</span>
            <span class="footer-date">2026.06.04</span>
        </div>

    </div>
</div>

<!-- Export buttons -->
<div class="export-area">
    <button class="export-btn" id="exportPng">保存为图片</button>
    <button class="export-btn" id="exportClip">复制到剪贴板</button>
</div>

<script>
(function() {
    // ── Count-up animation ──
    const statEl = document.getElementById('statNumber');
    const TARGET = 28;
    const DURATION = 1400;

    function countUp() {
        const start = performance.now();
        function tick(now) {
            const t = Math.min((now - start) / DURATION, 1);
            const eased = 1 - Math.pow(1 - t, 3);
            statEl.textContent = Math.round(TARGET * eased);
            if (t < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
    }

    // ── Bar fill animation ──
    function animateBars() {
        document.querySelectorAll('.cat-bar-fill').forEach(function(bar, i) {
            setTimeout(function() {
                bar.style.width = bar.dataset.width + '%';
            }, 600 + i * 100);
        });
    }

    // ── Kick off animations after card appears ──
    setTimeout(countUp, 500);
    setTimeout(animateBars, 400);

    // ── Export helper: force all animations to visible state ──
    function forceVisible(card) {
        card.style.opacity = '1';
        card.style.transform = 'none';
        card.style.animation = 'none';
        card.querySelectorAll('.anim-section').forEach(function(el) {
            el.style.opacity = '1';
            el.style.transform = 'none';
            el.style.animation = 'none';
        });
        card.querySelectorAll('.cat-bar-fill').forEach(function(bar) {
            bar.style.width = bar.dataset.width + '%';
        });
        statEl.textContent = TARGET;
    }

    function restoreAnimations(card) {
        card.style.opacity = '';
        card.style.transform = '';
        card.style.animation = '';
        card.querySelectorAll('.anim-section').forEach(function(el) {
            el.style.opacity = '';
            el.style.transform = '';
            el.style.animation = '';
        });
    }

    // ── Export: PNG download ──
    document.getElementById('exportPng').addEventListener('click', function() {
        var card = document.getElementById('card');
        forceVisible(card);
        setTimeout(function() {
            html2canvas(card, {
                scale: 3,
                backgroundColor: '#0d0b08',
                useCORS: true,
                logging: false,
            }).then(function(canvas) {
                restoreAnimations(card);
                var link = document.createElement('a');
                link.download = 'xhs-weekly-' + Date.now() + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }, 50);
    });

    // ── Export: Clipboard ──
    document.getElementById('exportClip').addEventListener('click', function() {
        var card = document.getElementById('card');
        forceVisible(card);
        setTimeout(function() {
            html2canvas(card, {
                scale: 3,
                backgroundColor: '#0d0b08',
                useCORS: true,
                logging: false,
            }).then(function(canvas) {
                restoreAnimations(card);
                canvas.toBlob(function(blob) {
                    if (navigator.clipboard && navigator.clipboard.write) {
                        navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': blob })
                        ]).then(function() {
                            var btn = document.getElementById('exportClip');
                            btn.textContent = '已复制';
                            setTimeout(function() { btn.textContent = '复制到剪贴板'; }, 2000);
                        });
                    }
                });
            });
        }, 50);
    });
})();
</script>
</body>
</html>
